<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A96E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8D5A3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9A96E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a45c8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b6ef0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="200" fill="#0A0A0F" rx="8"/>

  <!-- Decorative top line -->
  <line x1="30" y1="24" x2="185" y2="24" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6"/>
  <line x1="215" y1="24" x2="370" y2="24" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6"/>
  <circle cx="200" cy="24" r="3" fill="url(#goldGrad)"/>

  <!-- House/Villa icon -->
  <g transform="translate(175, 32)">
    <!-- Roof -->
    <polygon points="25,0 50,22 0,22" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Roof ridge decorations -->
    <line x1="25" y1="0" x2="25" y2="-6" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <circle cx="25" cy="-8" r="2" fill="url(#goldGrad)"/>
    <!-- Building body -->
    <rect x="4" y="22" width="42" height="26" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <!-- Door -->
    <rect x="18" y="32" width="14" height="16" rx="7" fill="none" stroke="url(#goldGrad)" stroke-width="1"/>
    <!-- Windows -->
    <rect x="7" y="27" width="7" height="6" rx="1" fill="none" stroke="url(#goldGrad)" stroke-width="0.8"/>
    <rect x="36" y="27" width="7" height="6" rx="1" fill="none" stroke="url(#goldGrad)" stroke-width="0.8"/>
  </g>

  <!-- Main title: LA VILLA -->
  <text x="200" y="108" font-family="'Georgia', 'Times New Roman', serif" font-size="11" letter-spacing="8" fill="url(#goldGrad)" text-anchor="middle" font-weight="400">LA VILLA</text>

  <!-- Main title: HEURT EVENTS -->
  <text x="200" y="130" font-family="'Georgia', 'Times New Roman', serif" font-size="22" letter-spacing="4" fill="url(#goldGrad)" text-anchor="middle" font-weight="700">HEURT EVENTS</text>

  <!-- Subtitle line -->
  <line x1="60" y1="144" x2="155" y2="144" stroke="url(#goldGrad)" stroke-width="0.6" opacity="0.5"/>
  <line x1="245" y1="144" x2="340" y2="144" stroke="url(#goldGrad)" stroke-width="0.6" opacity="0.5"/>
  <circle cx="200" cy="144" r="2" fill="url(#goldGrad)" opacity="0.7"/>

  <!-- Tagline -->
  <text x="200" y="162" font-family="'Arial', sans-serif" font-size="7.5" letter-spacing="3.5" fill="#C9A96E" text-anchor="middle" opacity="0.75">HARDENCOURT-COCHEREL · HAUTE-NORMANDIE</text>

  <!-- Bottom decorative stars -->
  <text x="130" y="180" font-family="'Arial', sans-serif" font-size="8" fill="#C9A96E" opacity="0.5">★ ★ ★ ★ ★</text>
  <text x="218" y="180" font-family="'Arial', sans-serif" font-size="8" fill="#C9A96E" opacity="0.5">★ ★ ★ ★ ★</text>

  <!-- Decorative bottom line -->
  <line x1="30" y1="188" x2="185" y2="188" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.4"/>
  <line x1="215" y1="188" x2="370" y2="188" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.4"/>
  <circle cx="200" cy="188" r="2" fill="url(#goldGrad)" opacity="0.5"/>
</svg>
